name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write # needed for softprops/action-gh-release to publish the release
  id-token: write # needed for attest-build-provenance to mint a Sigstore identity
  attestations: write # needed for attest-build-provenance to record the attestation

jobs:
  build:
    runs-on: macos-14 # Apple Silicon runner, matches the arm64-only target
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Build release binary
        run: cargo build --release --target aarch64-apple-darwin

      - name: Package tarball
        run: |
          version="${GITHUB_REF_NAME#v}"
          staging="boopaste-${version}-aarch64-apple-darwin"
          mkdir "$staging"
          cp target/aarch64-apple-darwin/release/boopaste "$staging/"
          cp README.md LICENSE "$staging/"
          tar -czf "${staging}.tar.gz" "$staging"
          shasum -a 256 "${staging}.tar.gz" > "${staging}.tar.gz.sha256"

      # Signs the tarball's digest with a short-lived Sigstore identity tied
      # to this exact workflow run and commit. Doesn't replace the sha256
      # check in the Homebrew formula, it proves *where* that binary came
      # from. Verify with: gh attestation verify <file> -R 0kira-vgl/boopaste
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: "boopaste-*.tar.gz"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            boopaste-*.tar.gz
            boopaste-*.tar.gz.sha256
          generate_release_notes: true
