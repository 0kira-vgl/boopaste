[package]
name = "boopaste"
version = "0.1.0"
edition = "2024"

[dependencies]
arboard = "3.6.1"
clap = { version = "4.6.6", features = ["derive"] }
core-foundation = "0.10.1"
core-graphics = "0.25.0"
image = "0.25.10"
objc2 = { version = "0.6.4", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSWorkspace", "NSRunningApplication", "NSApplication"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSString", "NSObject"] }
